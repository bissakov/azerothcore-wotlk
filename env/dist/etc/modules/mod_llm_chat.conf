[worldserver]

########################################
# mod-llm-chat configuration
########################################

# --------------------------------------------
# CORE MODULE TOGGLES & DEBUGGING
# --------------------------------------------

# LLMChat.Enable
#     Description: Enable or disable the module.
#     Default:     1 (true)
LLMChat.Enable = 1

# LLMChat.DebugEnabled
#     Description: Enables extra logging for debugging purposes.
#                  When set to 1 (true), detailed debug information will be logged by the module.
#                  When set to 0 (false), only standard logging is used.
#     Default:     0 (false)
LLMChat.DebugEnabled = 0

# LLMChat.DebugShowFullPrompt

#     Description: When enabled (1), logs the complete prompt sent to the LLM API including RAG information.
#                  This is useful for debugging what information the RAG system provides to bots.
#                  Only active when LLMChat.DebugEnabled is also enabled.
#                  When disabled (0), only standard logging is used.
#     Default:     0 (false)
LLMChat.DebugShowFullPrompt = 0

# --------------------------------------------
# LLM CONNECTION AND INFERENCE
# --------------------------------------------

# LLMChat.ApiKey
#     Description: Bearer token sent in the Authorization header. Required by
#                  hosted providers, normally left empty for a local server.
#                  Anyone who can read this config file can read the key.
#     Default:     (empty)
LLMChat.ApiKey =

# LLMChat.VerifySSL
#     Description: Verify the TLS certificate of an https:// endpoint. Leave this
#                  on whenever an ApiKey is set, otherwise the key can be
#                  intercepted. Disable only for a self-signed or ngrok endpoint.
#     Default:     1 (true)
LLMChat.VerifySSL = 1

# LLMChat.Url
#     Description: OpenAI-compatible chat-completions endpoint.
#     Default:     http://localhost:8080/v1/chat/completions
LLMChat.Url = https://nano-gpt.com/api/v1/chat/completions

# LLMChat.Model
#     Description: The model identifier sent in the API request. For an
#                  OpenAI-compatible provider this is their model name, e.g.
#                  gpt-4o-mini or meta-llama/llama-3.3-70b-instruct.
#                  Used for replies directed at a player, which is the only
#                  output a human is actually waiting on. See Model.Chatter
#                  below to route the high-volume traffic somewhere cheaper.
#     Default:     local-model
LLMChat.Model = zai-org/glm-5.2

# LLMChat.Model.Chatter
#     Description: Model used for random ambient chatter and event one-liners.
#                  These fire on a per-bot timer whether or not anyone is
#                  listening, so on a metered provider they dominate the bill
#                  while nobody is waiting on them. A small, cheap model is
#                  usually indistinguishable here.
#                  Leave empty to use LLMChat.Model.
#     Default:     (empty)
LLMChat.Model.Chatter = deepseek/deepseek-v4-pro-cheaper

# LLMChat.Model.Sentiment
#     Description: Model used to score how a bot feels about a player. The reply
#                  is a single number rather than prose, so the smallest model
#                  available is normally enough.
#                  Leave empty to use LLMChat.Model.Chatter, then
#                  LLMChat.Model.
#     Default:     (empty)
LLMChat.Model.Sentiment = deepseek/deepseek-v4-pro-cheaper

# LLMChat.NumPredict
#     Description: Maximum number of tokens to generate in LLM responses.
#     0 = unlimited. Only set if you want a hard cap.
#     Default: 40
#
#     | NumPredict | Approx. Words | Use Case                         |
#     |:----------:|:-------------:|:---------------------------------|
#     |     20     |   ~13–15      | Very short/emote/chat            |
#     |     30     |     ~20       | Short reply                      |
#     |     40     |   ~27–30      | Standard WoW reply (recommended) |
#     |     50     |   ~35–38      | Slightly longer reply            |
#     |     75     |   ~50–60      | Long quest/lore text             |
#     |    100+    |   70–80+      | Multi-paragraph (not typical)    |
LLMChat.NumPredict = 300

# LLMChat.NumPredict.Chatter
#     Description: Token cap for the chatter and sentiment tiers. Ambient
#                  chatter is a single line, so capping it low saves more on a
#                  per-token provider than the cheaper model does on its own.
#                  0 = unlimited, so -1 is used here to mean "inherit
#                  LLMChat.NumPredict".
#     Default:     -1 (inherit)
LLMChat.NumPredict.Chatter = 40

# LLMChat.Temperature
#     Description: Controls the "creativity" or randomness of the model’s output.
#                  Lower values (e.g., 0.2) = more focused, repetitive, and predictable.
#                  Higher values (e.g., 1.0) = more random, creative, or surprising.
#                  0.8 is a common default.
#     Example:     LLMChat.Temperature = 0.6
#     Default:     0.8
LLMChat.Temperature = 0.8

# LLMChat.TopP
#     Description: Controls nucleus sampling, another way to shape randomness.
#                  Lower values (e.g., 0.5) = more conservative.
#                  Higher values (up to 1.0) = more open.
#                  0.95 is a common default.
#     Example:     LLMChat.TopP = 0.9
#     Default:     0.95
LLMChat.TopP = 0.95

# LLMChat.Stop
#     Description: Optional. Comma-separated list of string "stop sequences". If the model outputs any of these strings, it will immediately stop generating further text and return the response up to that point. Use this to prevent the model from continuing into unwanted sections, such as another user's dialogue turn in a chat application.
#                  Example: "User:,Bot:" will stop the output if "User:" or "Bot:" appears in the response. Leave blank to disable.
#     Example:     LLMChat.Stop = User:,Bot:
#     Default:     (empty)
LLMChat.Stop =

# LLMChat.SystemPrompt
#     Description: Optional global system message used to steer the model.
#                  Leave blank for no system prompt, or enter your own.
#     Example:     LLMChat.SystemPrompt = "Always answer as if you are a WoW quest giver."
#     Default:     (empty)
LLMChat.SystemPrompt =

# LLMChat.Seed
#     Description: Optional. Random seed for deterministic generation. Set to a number for repeatable results, or leave blank for normal random output.
#     Example:     LLMChat.Seed = 42
#     Default:     (empty)
LLMChat.Seed =

# LLMChat.MaxConcurrentQueries
#     Description: Number of long-lived request workers. Requests beyond this
#                  limit wait in a FIFO queue without creating more OS threads.
#                  Values below 1 use one worker.
#     Default:     4
LLMChat.MaxConcurrentQueries = 2

# LLMChat.Queue.PrimaryCapacity
#     Description: Maximum queued player-directed requests. Producers never block.
#     Default:     64
LLMChat.Queue.PrimaryCapacity = 64

# LLMChat.Queue.AmbientCapacity
#     Description: Maximum queued background chatter, sentiment, and summary requests.
#                  Ambient work cannot consume capacity reserved for primary work.
#     Default:     128
LLMChat.Queue.AmbientCapacity = 128

# Request payloads use pooled 16 KiB blocks and are limited to 32 blocks (512 KiB).
# The pool is warmed during initialization; ordinary submissions never expand it.

# --------------------------------------------
# GENERAL CHATTER / RESPONSE LOGIC
# --------------------------------------------

# LLMChat.PlayerReplyChance.Say
#     Description: The percent chance (0-100) that an eligible bot replies to a player in Say/Yell channels.
#     Default:     90
LLMChat.PlayerReplyChance.Say = 90

# LLMChat.BotReplyChance.Say
#     Description: The percent chance (0-100) that an eligible bot replies to another bot in Say/Yell channels.
#     Default:     10
LLMChat.BotReplyChance.Say = 10

# LLMChat.PlayerReplyChance.Channel
#     Description: The percent chance (0-100) that an eligible bot replies to a player in custom channels (General, Trade, etc.).
#     Default:     60
LLMChat.PlayerReplyChance.Channel = 60

# LLMChat.BotReplyChance.Channel
#     Description: The percent chance (0-100) that an eligible bot replies to another bot in custom channels (General, Trade, etc.).
#     Default:     3
LLMChat.BotReplyChance.Channel = 3

# LLMChat.PlayerReplyChance.Party
#     Description: The percent chance (0-100) that an eligible bot replies to a player in Party/Raid chat.
#     Default:     90
LLMChat.PlayerReplyChance.Party = 90

# LLMChat.BotReplyChance.Party
#     Description: The percent chance (0-100) that an eligible bot replies to another bot in Party/Raid chat.
#     Default:     25
LLMChat.BotReplyChance.Party = 25

# LLMChat.PlayerReplyChance.Guild
#     Description: The percent chance (0-100) that an eligible bot replies to a player in Guild/Officer chat.
#     Default:     70
LLMChat.PlayerReplyChance.Guild = 70

# LLMChat.BotReplyChance.Guild
#     Description: The percent chance (0-100) that an eligible bot replies to another bot in Guild/Officer chat.
#     Default:     5
LLMChat.BotReplyChance.Guild = 5

# LLMChat.EnableWhisperReplies
#     Description: Enable or disable bot responses to whisper messages.
#                  When set to 0 (false), bots will not reply to any whispers.
#                  When set to 1 (true), bots will reply to whispers based on normal reply chances.
#     Default:     0 (false)
LLMChat.EnableWhisperReplies = 1

# LLMChat.MaxBotsToPick
#     Description: The maximum number of bots that can be randomly selected to reply when no bot name is explicitly mentioned.
#     Default:     2
LLMChat.MaxBotsToPick = 2

# LLMChat.BlacklistCommands
#     Description: A comma-separated list of command prefixes that should be ignored by AI bots.
#                  If a message starts with any of these prefixes, the bot will not respond.
#     Default:     
LLMChat.BlacklistCommands = autogear,talents,reset botAI,summon,release,revive,leave,attack,follow,flee,stay,runaway,grind,disperse,give leader,spells,cast ,quests,accept,drop,talk,reset,ss ,trainer,rti,rtsc,do ,ll ,e ,ue ,nc ,open,destroy,s ,b ,bank,gb ,u ,co ,ELVUI_VERSIONCHK,Asked,DPSMate_,LibGroupTalents,BLT,oRA3,Skada,HealBot,hbComms,questie,pfQuest,DBMv4-Ver,BWVQ3,add,remove,reset ai,report,state,help,log,stats,tank,offtank,healer,cc ,damage,boost,passive,defensive,aggressive,stay,guard,free,follow,assist,pet,stance,formation,rpg,emote,cheer,applaud,drink,eat,dance,attackers,reset instances,home,zone,who ,pos ,tele,grind,loot,quest,trainer,travel,teleport,homebind,unfollow,invite,uninvite,join,leave,leader,ready,release,save,update,reset talents,gear,trade,mail,ah ,ahscan,ahbid,ahbuy,ahsell,ahcancel,bag,repair,vendor,train,spells,reset spells,learn,unlearn,cast,uncast,use ,move,go ,look,stop,turn,face,wait,party,followleader,stayleader,moveleader,info,distance,debug,reset path,reset state,reset all,reset dungeon,reset raid,zone info,LHC40,RECOUNT,GTFO_v,Altoholic,DS_,DataStore

# LLMChat.SayDistance
#     Description: The maximum distance (in game units) a bot must be within to reply on a Say message.
#     Default:     30.0
LLMChat.SayDistance = 30.0

# LLMChat.YellDistance
#     Description: The maximum distance (in game units) a bot must be within to reply on a Yell message.
#     Default:     100.0
LLMChat.YellDistance = 100.0

# LLMChat.DisableForCustomChannels
#     Description: When enabled (1), disables LLM bot replies, random chatter, and events in custom channels (General, Trade, LookingForGroup, etc.).
#                  This allows you to reduce spam in public channels while keeping bot interactions in other chat types.
#     Default:     0 (false)
LLMChat.DisableForCustomChannels = 0

# LLMChat.DisableForSayYell
#     Description: When enabled (1), disables LLM bot replies, random chatter, and events in Say and Yell channels.
#                  Useful if you want bots to be silent in proximity-based chats.
#     Default:     0 (false)
LLMChat.DisableForSayYell = 0

# LLMChat.DisableForGuild
#     Description: When enabled (1), disables LLM bot replies, random chatter, and events in Guild and Officer channels.
#                  Useful for keeping guild chat focused without bot chatter.
#     Default:     0 (false)
LLMChat.DisableForGuild = 0

# LLMChat.DisableForParty
#     Description: When enabled (1), disables LLM bot replies, random chatter, and events in Party and Raid channels.
#                  Useful if you want party chat to be bot-free.
#     Default:     0 (false)
LLMChat.DisableForParty = 0

# --------------------------------------------
# RANDOM CHATTER SYSTEM
# --------------------------------------------

# LLMChat.EnableRandomChatter
#     Description: Enable or disable random chatter from AI bots when a real player is nearby.
#     Default:     1 (true)
LLMChat.EnableRandomChatter = 1

# LLMChat.DisableRepliesInCombat
#     Description: If true, bots will not reply or produce random chatter when in combat.
#     Default:     1
LLMChat.DisableRepliesInCombat = 1

# LLMChat.MinRandomInterval
#     Description: The minimum time (in seconds) between random lines from an AI bot.
#     Default:     45
LLMChat.MinRandomInterval = 45

# LLMChat.MaxRandomInterval
#     Description: The maximum time (in seconds) between random lines from an AI bot.
#     Default:     180
LLMChat.MaxRandomInterval = 180

# LLMChat.RandomChatterRealPlayerDistance
#     Description: The maximum distance (in game units) a real player must be within for random bot chatter to trigger.
#     Default:     200.0
LLMChat.RandomChatterRealPlayerDistance = 40.0

# LLMChat.RandomChatterBotCommentChance
#     Description: The percent chance (0-100) that an AI bot will add a comment when random chatter is triggered.
#     Default:     5
LLMChat.RandomChatterBotCommentChance = 5

# LLMChat.RandomChatterMaxBotsPerPlayer
#     Description: The maximum number of AI bots that can trigger per random chatter update when a real player is nearby.
#                  This limits how many bots can respond at once to avoid spam.
#                   Each bot can only process once per tick, no duplicates if multiple real players are close.
#     Default:     2
LLMChat.RandomChatterMaxBotsPerPlayer = 2

# LLMChat.RandomChatterPromptTemplate
#   Description: The template string for random bot chatter prompts.
#   Placeholders (named): {bot_name} {bot_level} {bot_class} {bot_race} {bot_gender} {bot_role} {bot_faction} {bot_area} {bot_zone} {bot_map} {bot_personality} {bot_personality_name} {environment_info}
#   Note: {bot_personality_name} contains the name/key of the personality (e.g., "grumpy", "helpful"), while {bot_personality} contains the full personality description text.
LLMChat.RandomChatterPromptTemplate = "You are a Wrath-era WoW player. Name: {bot_name}, Level: {bot_level} {bot_class}, {bot_race} {bot_gender}, Spec: {bot_role}, Faction: {bot_faction}. Location: {bot_area}, Zone: {bot_zone}, Map: {bot_map}. MAKE SURE YOU RESPOND USING YOUR PERSONALITY, WHICH IS: {bot_personality_name}: {bot_personality}. {environment_info} Reply casually in under 15 words. No quotes, markdown, symbols, or emojis. Use real WoW slang. Avoid uncommon jargon or formatting."

# LLMChat.RandomChatterPromptVariations
#   Description: Pipe-separated (|) list of additional prompt instructions that will be randomly selected and appended to the RandomChatterPromptTemplate.
#                This adds variety to bot responses by changing the angle or focus of their random chatter.
#                One variation is randomly chosen each time a bot generates random chatter.
#                Leave empty to disable variations and use only the base template.
#   Example:     "Talk about the weather or environment.|Comment on your current task or goal.|Make an observation about nearby creatures or players."
#   Default:     (see below for Wrath-era appropriate variations)
LLMChat.RandomChatterPromptVariations = "Complain about something typical WoW players complain about.|Make a casual observation about leveling or grinding.|Share your opinion on Horde vs Alliance.|Comment on how tough or easy the zone feels.|Make a joke or sarcastic remark about WoW.|Mention something about the Lich King expansion.|Talk about wanting better gear or loot.|Comment on flying mounts or Northrend travel.|Complain about repair costs or gold.|Make an observation about your class in general.|Comment on dungeon finder or group content.|Talk about daily quests or reputation grinds.|Mention Death Knights being OP or annoying.|Share your thoughts on arena or battlegrounds.|Complain about nerfed abilities or changes.|Talk about needing to farm materials or gold.|Comment on the cold weather in Northrend.|Mention wanting to raid or do heroics.|Talk about achievements being too grindy.|Make a casual remark about quest objectives."

# LLMChat.RandomChatterQuestionVariations
#   Description: Pipe-separated (|) list of prompt instructions telling the LLM to generate questions that will stimulate OTHER bots or players to respond.
#                When a bot uses one of these variations, the LLM will generate a question based on the prompt instruction.
#                These questions are meant to encourage other bots (via BotReplyChance) and real players to engage in conversation.
#                When a bot generates random chatter, it will randomly choose between making a statement (RandomChatterPromptVariations)
#                or asking a question (RandomChatterQuestionVariations).
#                Leave empty to disable question variations and only use statement variations.
#   Example:     "Ask about dungeon preferences.|Ask if anyone wants to PvP.|Ask about raid progression."
#   Default:     (see below for engaging Wrath-era question prompts designed to stimulate bot-to-bot and player-to-bot conversations)
LLMChat.RandomChatterQuestionVariations = "Ask if others think this zone is difficult.|Ask about favorite dungeons.|Ask about Icecrown Citadel progression.|Ask about daily quest frustrations.|Ask about Naxxramas difficulty compared to original.|Ask what spec people are running.|Ask about Death Knight popularity.|Ask about upcoming Death Knight nerfs.|Ask about gold-making strategies in Wrath.|Ask if anyone is farming badges.|Ask about excitement for Ulduar.|Ask if dual spec was worth the cost.|Ask about opinions on the old talent trees.|Ask about favorite raid bosses.|Ask if flying mounts ruined world PvP.|Ask who's doing arena this season.|Ask about arena ratings.|Ask about Wintergrasp balance.|Ask about Oculus dungeon opinions.|Ask which professions make the most gold.|Ask about old-world flying possibilities.|Ask about reputation mount farming.|Ask which heroic dungeon is hardest.|Ask if emblems are too easy to get."

# --------------------------------------------
# EVENT CHATTER SYSTEM
# --------------------------------------------

# LLMChat.EnableEventChatter
#     Description: Enables or disables the event-based chatter system (e.g. player deaths, entering zones).
#                  When enabled (1), bots will respond to predefined game events.
#     Default:     1 (true)
LLMChat.EnableEventChatter = 1

# LLMChat.EventChatterRealPlayerDistance
#     Description: The maximum distance (in game units) a real player must be within to trigger event-based bot chatter.
#     Default:     40.0
LLMChat.EventChatterRealPlayerDistance = 40.0

# LLMChat.EventChatterBotCommentChance
#     Description: The percent chance (0–100) that an AI bot will respond to a game event another player generates.
#     Default:     25
LLMChat.EventChatterBotCommentChance = 25

# LLMChat.EventChatterBotSelfCommentChance
#     Description: The percent chance (0–100) that an AI bot will respond to a game event it generates itself.
#     Default:     5
LLMChat.EventChatterBotSelfCommentChance = 5

# LLMChat.EventChatterMaxBotsPerPlayer
#     Description: The maximum number of bots allowed to respond to a single player's event.
#     Default:     2
LLMChat.EventChatterMaxBotsPerPlayer = 2

# LLMChat.EventChatterPromptTemplate
#     Description: The template used to generate bot prompts when reacting to world events.

#     Placeholders (named): {bot_name} {bot_level} {bot_class} {bot_race} {bot_gender} {bot_role} {bot_faction} {bot_area} {bot_zone} {bot_map} {bot_personality} {bot_personality_name} {event_type} {event_detail} {actor_name} {sentiment_info}
#     Note: {bot_personality_name} contains the name/key of the personality (e.g., "grumpy", "helpful"), while {bot_personality} contains the full personality description text.
LLMChat.EventChatterPromptTemplate = "You are {bot_name}, a level {bot_level} {bot_class} ({bot_race} {bot_gender}) specializing as a {bot_role} from the {bot_faction} faction. You are currently in {bot_area}, Zone: {bot_zone}, Map: {bot_map}. Personality: {bot_personality_name}: {bot_personality}. {sentiment_info} Event: {actor_name} {event_type} {event_detail}. Respond to this specific Event that just happened in character, casually, in under 15 words. Avoid emojis, markdown, or narration."

# --------------------------------------------
# TYPING SIMULATION
# --------------------------------------------

# LLMChat.EnableTypingSimulation
#     Description: When enabled (1), bots will delay their responses proportionally to the message length
#                  to simulate realistic typing behavior. The delay is calculated as:
#                  BaseDelay + (MessageLength * DelayPerChar) milliseconds
#                  Example: 100 character message with defaults = 1000ms + (100 * 250ms) = 26 seconds
#     Default:     0 (false)
LLMChat.EnableTypingSimulation = 0

# LLMChat.TypingSimulationBaseDelay
#     Description: Base delay in milliseconds before a bot starts "typing" a response.
#                  This simulates the time it takes to read the message and start typing.
#     Default:     1000
LLMChat.TypingSimulationBaseDelay = 1000

# LLMChat.TypingSimulationDelayPerChar
#     Description: Additional delay in milliseconds per character in the bot's response.
#                  Realistic typing speeds:
#                  - 400ms per char = 2.5 chars/sec (slow/casual)
#                  - 250ms per char = 4 chars/sec (average human)
#                  - 150ms per char = 6.7 chars/sec (proficient)
#                  - 100ms per char = 10 chars/sec (professional)
#     Default:     250
LLMChat.TypingSimulationDelayPerChar = 250

# --------------------------------------------
# RP PERSONALITIES SYSTEM
# --------------------------------------------

# LLMChat.EnableRPPersonalities
#     Description: Enables or disables the use of defined roleplay personalities for AI bots.
#                  When enabled (1), bots will respond with distinct personalities based on their assigned type.
#                  When disabled (0), bots will use a neutral/default response style.
#     Default:     0 (false)
LLMChat.EnableRPPersonalities = 1

# LLMChat.DefaultPersonalityPrompt
#     Description: The fallback personality description used when a bot has no specific roleplay type assigned.
#     Default:     Talk like a standard WoW player.
LLMChat.DefaultPersonalityPrompt = "Speak like a real WoW player from Wrath. Stay in character and use casual in-game tone."

# --------------------------------------------
# CONVERSATION HISTORY AND SNAPSHOT SYSTEM
# --------------------------------------------

# LLMChat.EnableChatHistory
#     Description: Enables or disables the use of Chat History.
#     Default:     1 (true)
LLMChat.EnableChatHistory = 1

# LLMChat.ConversationHistoryRecentTurns
#     Description: Number of recent player + bot exchanges included verbatim for
#                  each bot/player relationship. Older turns remain durable in
#                  the database according to ConversationHistoryRetentionTurns.
#     Default:     200
LLMChat.ConversationHistoryRecentTurns = 200

# LLMChat.ConversationHistoryRetentionTurns
#     Description: Maximum durable transcript turns per bot/player relationship.
#                  0 keeps the complete transcript forever. This is independent
#                  from the smaller recent window inserted into each prompt.
#     Default:     0 (unlimited)
LLMChat.ConversationHistoryRetentionTurns = 0

# LLMChat.EnableRelationshipMemory
#     Description: Periodically condense older conversation into a durable,
#                  factual memory for each bot/player relationship. The memory
#                  survives restarts and is supplied alongside recent verbatim
#                  turns. Refreshing happens asynchronously.
#     Default:     1 (enabled)
LLMChat.EnableRelationshipMemory = 1

# LLMChat.RelationshipMemoryUpdateTurns
#     Description: Refresh long-term memory after this many new exchanges.
#                  0 disables refreshes without deleting existing memories.
#     Default:     25
LLMChat.RelationshipMemoryUpdateTurns = 25

# LLMChat.RelationshipMemorySourceTurns
#     Description: Number of latest exchanges considered during a memory
#                  refresh, in addition to the existing durable summary.
#     Default:     50
LLMChat.RelationshipMemorySourceTurns = 50

# LLMChat.ConversationHistorySaveInterval
#     Description: The interval (in minutes) between durable-history retention
#                  cleanup passes. New turns are written immediately. Set to 0
#                  to disable cleanup; this is normally paired with unlimited
#                  retention.
#     Default:     10
LLMChat.ConversationHistorySaveInterval = 10

# LLMChat.EnableChatBotSnapshotTemplate
#     Description: Enable or disable additional awareness context for each bot.
#                  When enabled (1), the bot will include a snapshot of its current status and surroundings in the chat prompt.
#                  This includes combat status, group info, known spells, active quests, line of sight objects, and nearby players.
#                  When disabled (0), this context is not included in the chat prompt.
#                  This is useful for bots that need to be aware of their environment and current status.
#                  Enabling this may increase the response time and token usage of the API calls.
#     Default:     1 (true)
LLMChat.EnableChatBotSnapshotTemplate = 1

# LLMChat.ChatHistoryHeaderTemplate
#   Description: Format for header in conversation history context.
#   Placeholders (named): {player_name}
LLMChat.ChatHistoryHeaderTemplate = "Recent chats with {player_name}. Use only for context. Reply to the new message."

# LLMChat.ChatHistoryLineTemplate
#   Description: Format for each line in conversation history context.
#   Placeholders (named): {player_name} {player_message} {bot_reply}
LLMChat.ChatHistoryLineTemplate = "{player_name} said: {player_message}\nYou said: {bot_reply}\n"

# LLMChat.ChatHistoryFooterTemplate
#   Description: Format for footer in conversation history context.
#   Placeholders (named): {player_name} {player_message}
LLMChat.ChatHistoryFooterTemplate = "NEW MESSAGE from {player_name}: {player_message}"

# LLMChat.ChatBotSnapshotTemplate
#   Description: The template string for the context snapshot of the bot's surroundings and status.
#   Placeholders (named): {identity} {progression} {activity} {equipment} {inventory} {combat} {group} {spells} {quests} {los} {players}
LLMChat.ChatBotSnapshotTemplate = "CURRENT CHARACTER STATE (authoritative; never invent conflicting details):\n\nIDENTITY:\n{identity}\n\nPROGRESSION:\n{progression}\n\nCURRENT INTENTION:\n{activity}\n\nCOMBAT:\n{combat}\n\nGROUP:\n{group}\n\nEQUIPMENT:\n{equipment}\n\nBAGS:\n{inventory}\n\nKNOWN USABLE SPELLS:\n{spells}\n\nQUEST LOG AND OBJECTIVE PROGRESS:\n{quests}\n\nVISIBLE OBJECTS:\n{los}\n\nNEARBY PLAYERS:\n{players}"

# ----------------------------------------------
# SENTIMENT TRACKING SYSTEM
# ----------------------------------------------

# Enable or disable sentiment tracking between bots and players
# Disabled by default due to needing an extra LLM call.
# Default: 0 (disabled)
LLMChat.EnableSentimentTracking = 1

# Default sentiment value for new bot-player relationships
# Range: 0.0 (hostile) to 1.0 (friendly), 0.5 = neutral
# Default: 0.5
LLMChat.SentimentDefaultValue = 0.5

# How much to adjust sentiment per positive/negative message
# Range: 0.01 to 0.5 (smaller = more gradual changes)
# Default: 0.05
LLMChat.SentimentAdjustmentStrength = 0.05

# How often to save sentiment data to database (in minutes)
# Set to 0 to disable periodic saving
# Default: 10
LLMChat.SentimentSaveInterval = 10

# Prompt template for sentiment analysis
# Use {message} placeholder for the message to analyze
# Default: "Analyze the sentiment of this message: \"{message}\". Respond only with: POSITIVE, NEGATIVE, or NEUTRAL."
LLMChat.SentimentAnalysisPrompt = "Analyze the sentiment of this message: \"{message}\". Respond only with: POSITIVE, NEGATIVE, or NEUTRAL."

# Template for including sentiment information in bot prompts
# Use {player_name} and {sentiment_value} placeholders
# Default: "Your relationship sentiment with {player_name} is {sentiment_value} (0.0=hostile, 0.5=neutral, 1.0=friendly). Use this to guide your tone and response."
LLMChat.SentimentPromptTemplate = "Your relationship sentiment with {player_name} is {sentiment_value} (0.0=hostile, 0.5=neutral, 1.0=friendly). Use this to guide your tone and response."

# --------------------------------------------
# CHAT/PROMPT TEMPLATES
# --------------------------------------------

# LLMChat.ChatPromptTemplate
#   Description: The main template for bot chat prompts sent to the LLM.
#   Placeholders (named): {bot_name} {bot_level} {bot_class} {bot_personality} {bot_personality_name} {player_level} {player_class} {player_name} {player_message} {extra_info} {sentiment_info}
#   Note: {bot_personality_name} contains the name/key of the personality (e.g., "grumpy", "helpful"), while {bot_personality} contains the full personality description text.
LLMChat.ChatPromptTemplate = "You're a Wrath-era WoW player familiar with Vanilla and TBC. Name: {bot_name}, Level: {bot_level} {bot_class}. RESPOND USING YOUR PERSONALITY: {bot_personality_name}: {bot_personality}. {sentiment_info} {chat_history} A level {player_level} {player_class} named {player_name} said: '{player_message}'. {extra_info} Reply naturally, usually in one to three sentences. Keep greetings and small talk concise, but use enough detail to answer questions, explain plans, discuss quests, or give directions accurately. Use authentic WoW tone and ordinary chat language. Be blunt if provoked. Never contradict the authoritative character state, claim experiences you did not have, or act like a narrator. Do not use markdown or prefix the reply with your name."

# LLMChat.ChatExtraInfoTemplate
#   Description: The context/details string about the bot and player, injected into the chat prompt as the last parameter.
#   Placeholders (named): {bot_race} {bot_gender} {bot_role} {bot_faction} {bot_guild} {bot_group_status} {bot_gold} {player_race} {player_gender} {player_role} {player_faction} {player_guild} {player_group_status} {player_gold} {player_distance} {bot_area} {bot_zone} {bot_map}
LLMChat.ChatExtraInfoTemplate = "Your Info: {bot_race} {bot_gender}, Spec: {bot_role}, Faction: {bot_faction}, Guild: {bot_guild}, Group: {bot_group_status}, Gold: {bot_gold}. Player Info: {player_race} {player_gender}, Spec: {player_role}, Faction: {player_faction}, Guild: {player_guild}, Group: {player_group_status}, Gold: {player_gold}, Distance: {player_distance} yards. Location: {bot_area}, Zone: {bot_zone}, Map: {bot_map}. Only respond to the new message. No commentary, no meta-talk, no prefix—just the reply."

